name: Post new Steam releases

on:
  schedule:
    - cron: "3-58/5 * * * *"   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, dry-run, or seed"
        default: normal

permissions:
  contents: write   # to commit state/seen.json back to the repo

concurrency:
  group: steam-bsky-bots
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bots
        env:
          BSKY_AI_HANDLE: ${{ secrets.BSKY_AI_HANDLE }}
          BSKY_AI_APP_PASSWORD: ${{ secrets.BSKY_AI_APP_PASSWORD }}
          BSKY_NO_AI_HANDLE: ${{ secrets.BSKY_NO_AI_HANDLE }}
          BSKY_NO_AI_APP_PASSWORD: ${{ secrets.BSKY_NO_AI_APP_PASSWORD }}
          NSFW_MODE: ${{ vars.NSFW_MODE }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            dry-run) python bot.py --dry-run ;;
            seed)    python bot.py --seed ;;
            *)       python bot.py ;;
          esac

      - name: Save state
        if: always()
        run: |
          git config user.name "steam-bsky-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d state ]; then
            echo "No state to save (dry run, or the bot stopped before saving)."
            exit 0
          fi
          git add state/
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -m "Update seen games [skip ci]"
          git push
